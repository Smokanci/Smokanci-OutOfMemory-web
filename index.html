<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- iPhone Safari gives a page no Fullscreen API. Launched from the home screen, these drop the browser bars instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OutofMemory">
    <link rel="manifest" href="manifest.webmanifest">
    <title>OutofMemory</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1F1F20 }
      #unity-container { position: fixed; inset: 0; background: #1F1F20 }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #1F1F20; touch-action: none }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; width: 40%; height: 6px; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.15) }
      #unity-progress-bar-full { width: 0%; height: 100%; background: rgba(255, 255, 255, 0.8) }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); font-family: sans-serif; display: none }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type)
      {
        function updateBannerVisibility()
        {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.textContent = msg;
        div.style.padding = "10px";
        div.style.background = type == "error" ? "red" : type == "warning" ? "yellow" : "white";
        warningBanner.appendChild(div);
        if (type != "error")
        {
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Browsers grant fullscreen only inside a gesture, so the page asks on every tap or click made outside
      // fullscreen: the first enters it, and the next one after the player leaves enters it again. The container, not
      // Unity's canvas, goes fullscreen, so a tap during loading counts too.
      var fullscreenEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
      var requestFullscreen = container.requestFullscreen || container.webkitRequestFullscreen;

      function fullscreenElement()
      {
        return document.fullscreenElement || document.webkitFullscreenElement;
      }

      // Only a fullscreen page may lock its orientation, and desktop browsers refuse the lock, so a touch screen alone
      // asks. Where the lock is refused, RotatePrompt holds the game while the window is portrait.
      function lockLandscape()
      {
        if (!window.matchMedia("(pointer: coarse)").matches || !screen.orientation || !screen.orientation.lock)
        {
          return;
        }
        screen.orientation.lock("landscape").catch(function (error) {
          console.info("Orientation lock refused: " + error.message);
        });
      }

      function enterFullscreen()
      {
        if (fullscreenElement())
        {
          return;
        }
        // Safari's prefixed call returns nothing rather than a promise.
        Promise.resolve(requestFullscreen.call(container, { navigationUI: "hide" }))
          .then(lockLandscape)
          .catch(function (error) {
            console.warn("Fullscreen refused: " + error.message);
          });
      }

      if (fullscreenEnabled)
      {
        // Capture, so the request goes out before Unity's own handlers see the event.
        document.addEventListener("pointerup", enterFullscreen, true);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/11522d7bd357edd8c6f1820fba61e788.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/dea39433bd05d35893ecaf840381e7a2.data.unityweb",
        frameworkUrl: buildUrl + "/608e80118b60a49f0e48fe065baab9f0.framework.js.unityweb",
        codeUrl: buildUrl + "/a2c34e8ef84dbab1c30a67ed8209e29d.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Happy Figs",
        productName: "OutofMemory",
        productVersion: "0.0.1",
        showBanner: unityShowBanner,
        // The game's saves are files under persistentDataPath, which reach the browser's IndexedDB only when synced.
        autoSyncPersistentDataPath: true,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function ()
      {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = 100 * progress + "%";
        }).then(function () {
          loadingBar.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
